<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1411" />
    <title>Nexio Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <img class="logo" src="nexio-logo.png" alt="Nexio Financeiro" />
      <div class="loader" aria-hidden="true"></div>
      <h1>Nexio Financeiro</h1>
      <p id="message">Carregando seu controle financeiro...</p>
      <button id="retryButton" class="button" type="button" hidden>Tentar novamente</button>
    </main>

    <script>
      const appUrl = "https://nexiofinanceiro.vercel.app";
      const message = document.getElementById("message");
      const retryButton = document.getElementById("retryButton");

      function openApp() {
        if (!navigator.onLine) {
          message.textContent = "Sem internet no momento. Conecte-se para abrir o Nexio Financeiro.";
          retryButton.hidden = false;
          return;
        }
        message.textContent = "Abrindo Nexio Financeiro...";
        retryButton.hidden = true;
        window.location.replace(appUrl);
      }

      retryButton.addEventListener("click", openApp);
      window.addEventListener("online", openApp);
      window.setTimeout(openApp, 450);
    </script>
  </body>
</html>
